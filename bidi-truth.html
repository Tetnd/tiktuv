<!doctype html>
<html lang="he" dir="rtl">
  <head><meta charset="utf-8" /><title>Bidi truth 2</title></head>
  <body style="font-family:'Segoe UI',Arial,sans-serif;font-size:20px">
    <div id="out"></div>
    <script>
      const cases = [
        "Whisper Large v3 (כללי — לא מותאם לעברית)",
        "Whisper Small (מהיר — דיוק נמוך)",
        "Soniox (תמלול בענן)",
        "עברית — ivrit.ai Whisper Large v3 (מומלץ)",
        "Whisper Large v3 (כללי — לא מותאם לעברית) — טרם הורד",
        "‎3.2‎ מ\"ב · ‎03:35‎ · ‎soniox/stt-async-v6‎",
        "⁦3.2⁩ מ\"ב · ⁦03:35⁩ · ⁦soniox/stt-async-v6⁩"
      ];
      const out = document.getElementById("out");
      for (const c of cases) { const p = document.createElement("p"); p.textContent = c; out.appendChild(p); }
      window.visualOrder = () => [...document.querySelectorAll("p")].map((p) => {
        const n = p.firstChild, t = n.textContent, r = document.createRange(), items = [];
        for (let i = 0; i < t.length; i++) { r.setStart(n, i); r.setEnd(n, i + 1);
          items.push([r.getBoundingClientRect().left, t[i]]); }
        items.sort((a, b) => a[0] - b[0]);
        return items.map((x) => x[1]).join("");
      });
    </script>
  </body>
</html>
