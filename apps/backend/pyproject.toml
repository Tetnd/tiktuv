[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktuv-backend"
version = "1.0.2"
description = "Local-first Hebrew speech-to-text backend for Tiktuv"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tiktuv" }]

# NOTE: torch is intentionally NOT listed here. PyTorch must be installed from
# the PyTorch index with the correct CPU/CUDA variant *before* this package.
# See docs/gpu-cuda-setup.md and docs/cpu-only-setup.md.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "python-multipart==0.0.20",
    "numpy==2.1.3",
    "python-docx==1.1.2",
    "reportlab==4.2.5",
    "arabic-reshaper==3.0.0",
    "python-bidi==0.6.3",
    "psutil==6.1.1",
    # Used to fetch cloud recordings (Zoom) over HTTPS.
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Inference stack. Kept separate so the API, exports and tests can be installed
# and exercised without a multi-gigabyte ML install.
asr = [
    "transformers==4.47.1",
    "accelerate==1.2.1",
    "huggingface-hub==0.27.0",
    "safetensors==0.4.5",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-timeout==2.3.1",
    # Used by the export tests to read generated PDFs back and assert that the
    # Hebrew glyphs really were embedded.
    "pypdf==5.1.0",
    "mypy==1.14.0",
    "ruff==0.8.4",
]

[project.scripts]
tiktuv = "tiktuv.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiktuv*"]

[tool.setuptools.package-data]
tiktuv = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "real_model: hits the real ivrit-ai model; opt-in via TIKTUV_RUN_REAL_MODEL_TEST=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# reportlab, python-docx, python-bidi, torch and transformers ship no py.typed
# marker. Rather than analysing them as untyped (which makes strict mode reject
# every call into them), treat them as Any at the import boundary. Our own
# wrappers in exports/ and asr/ are fully typed, so the boundary is where the
# checking happens.
disable_error_code = ["import-untyped"]
